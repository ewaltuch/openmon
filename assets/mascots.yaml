# Mascot species, type chart and wild encounters for Open-Mon.
# Loaded by src/engine/mascots.py.

types: [Kernel, Shell, Browser, Editor]

# Species stats (hp/atk/defense/spd) are the values at base_level
base_level: 5
max_level: 50

# Attacking type -> defending type -> damage multiplier (default 1.0)
type_effectiveness:
  # Cycle Kernel > Shell > Browser > Editor > Kernel; see docs/design.md
  Kernel: {Shell: 2.0, Editor: 0.5}
  Shell: {Browser: 2.0, Kernel: 0.5}
  Browser: {Editor: 2.0, Shell: 0.5}
  Editor: {Kernel: 2.0, Browser: 0.5}

species:
  Tux:
    type: Kernel
    hp: 24
    atk: 8
    defense: 6
    spd: 7
    # Stats above are level 5; each level adds `growth` (fractions carry)
    growth: {hp: 2.5, atk: 1.2, defense: 1.0, spd: 1.0}
    xp_yield: 55
    learnset:  # level -> move; only the newest 4 are kept
      - {level: 1, name: Peck, power: 6, type: Kernel}
      - {level: 1, name: Code, power: 8, type: Editor}
      - {level: 1, name: Shellshock, power: 10, type: Shell}
      - {level: 9, name: Sudo, power: 11, type: Kernel}
      - {level: 14, name: Kernel Panic, power: 14, type: Kernel}
      - {level: 20, name: Rm -rf, power: 16, type: Shell}
    # Drawn until a real sprite exists: palette shades and the "feet" box
    sprite: tux  # assets/sprites/tux.png (from mascots/tux.svg); optional
    placeholder: {body: 2, feet: 3, feet_box: [14, 20, 18, 28]}

