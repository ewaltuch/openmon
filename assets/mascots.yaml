# Mascot species, type chart and wild encounters for Open-Mon.
# Loaded by src/engine/mascots.py.

types: [Kernel, Shell, Browser, Editor]

# Attacking type -> defending type -> damage multiplier (default 1.0)
type_effectiveness:
  # Cycle Kernel > Shell > Browser > Editor > Kernel; see docs/design.md
  Kernel: {Shell: 2.0, Editor: 0.5}
  Shell: {Browser: 2.0, Kernel: 0.5}
  Browser: {Editor: 2.0, Shell: 0.5}
  Editor: {Kernel: 2.0, Browser: 0.5}

species:
